<div class="technician-action">

  <h3>Technician Assignment</h3>

  @if (request) {

    <p>
      <strong>Request:</strong>
      {{ request.requestCode }}
    </p>

    <p>
      <strong>Request Type:</strong>
      {{ request.requestType }}
    </p>

    <p>
      <strong>Status:</strong>
      {{ request.status }}
    </p>

    <p>
      <strong>Current Technician:</strong>

      @if (request.technicianName) {
        {{ request.technicianName }}
      } @else {
        Not Assigned
      }

    </p>
  }

  <div class="technician-form">

    <label for="technician">
      Select Technician
    </label>

    <select
      id="technician"
      [(ngModel)]="selectedTechnicianId"
    >

      <option [ngValue]="null">
        Select Technician
      </option>

      @for (technician of technicians; track technician.technicianId) {

        <option
          [ngValue]="technician.technicianId"
        >
          {{ technician.technicianName }}
        </option>

      }

    </select>

    <button
      type="button"
      (click)="assignTechnician()"
      [disabled]="!selectedTechnicianId"
    >
      Assign Technician
    </button>

  </div>

</div>
