<section class="components-demo">

  <header class="page-header">

    <h1>
      Advanced Angular Components
    </h1>

    <p>
      Dynamic Components, @Input, @Output and Content Projection
    </p>

  </header>


  @if (loading) {

    <div class="loading">
      Loading request...
    </div>

  }


  @if (errorMessage) {

    <div class="error">
      {{ errorMessage }}
    </div>

  }


  @if (request) {

    <app-request-action-panel
      [request]="request">
    </app-request-action-panel>

  }

</section>
