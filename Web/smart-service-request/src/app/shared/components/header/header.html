<header class="header">
  <div class="header-container">

    <div class="logo">
      <img class="logo-mark" src="logo-mark.png" alt="" width="34" height="34">
      <span class="logo-text">DeskPilot</span>
    </div>

    @if (isLoggedIn) {

    <nav aria-label="Main navigation">
      @if (isAdmin) {
      <a routerLink="/dashboard" routerLinkActive="active">
        Dashboard
      </a>

      <a routerLink="/request/new" routerLinkActive="active">
        Create Request
      </a>

      <a routerLink="/request-management" routerLinkActive="active">
        Request Management
      </a>

      <a routerLink="/users" routerLinkActive="active">
        Users
      </a>
      }

      @if (isEmployee) {
      <a routerLink="/my-requests" routerLinkActive="active">
        My Requests
      </a>
      <a routerLink="/request/new" routerLinkActive="active">
        Create Request
      </a>
      }

      @if (isTechnician) {
      <a routerLink="/assigned-requests" routerLinkActive="active">
        My Assigned Requests
      </a>
      }
    </nav>

    <div class="admin-area">
      <div class="user-chip">
        <span class="user-avatar" aria-hidden="true">{{ adminName?.charAt(0) }}</span>
        <span class="user-meta">
          <span class="user-name">{{ adminName }}</span>
          <span class="user-role">{{ userRole }}</span>
        </span>
      </div>

      <button type="button" class="logout-btn" (click)="logout()">
        Logout
      </button>
    </div>

    }

  </div>
</header>
