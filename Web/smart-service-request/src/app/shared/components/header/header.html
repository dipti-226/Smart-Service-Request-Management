<header class="header">
  <div class="header-container">

    <div class="logo">
      <span class="logo-mark">SSR</span>
      <span class="logo-text">Smart Service Request</span>
    </div>

    @if (isLoggedIn) {

      <nav>
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/request/new" routerLinkActive="active">Create Request</a>
      </nav>

      <div class="admin-area">
        <span class="admin-badge">{{ adminName }}</span>
        <button type="button" class="logout-btn" (click)="logout()">
          Logout
        </button>
      </div>

    }

  </div>
</header>
